name: CI Validation

on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "hotfix/**", "release/**", "copilot/**"]
  pull_request:

permissions:
  contents: read

jobs:
  structure-validation:
    name: Repository Structure Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Validate required structure
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for d in metadata metadata/tags configs/automation docs docs/architecture docs/governance docs/operations docs/deployment scripts/validate scripts/reporting scripts/cleanup templates status artifacts artifacts/incoming artifacts/staged artifacts/releases; do
            if [[ ! -d "$d" ]]; then echo "MISSING dir: $d"; missing=$((missing + 1)); fi
          done
          for f in metadata/repository-profile.yml metadata/tags/taxonomy.yml metadata/tags/rules.yml metadata/tags/file-tags.yml README.md SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md LICENSE CHANGELOG.md CODEOWNERS; do
            if [[ ! -f "$f" ]]; then echo "MISSING file: $f"; missing=$((missing + 1)); fi
          done
          (( missing == 0 )) || exit 1

  corporate-identity:
    name: Corporate Identity Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Validate corporate spelling
        shell: bash
        run: |
          set -euo pipefail
          if grep -rl --include='*.md' 'AT-Medical GmbH' . --exclude-dir=.git | grep -q .; then
            echo "Use 'AT Medical GmbH®' in prose." >&2
            exit 1
          fi
          for f in README.md SECURITY.md CONTRIBUTING.md; do
            [[ ! -f "$f" ]] || grep -qi 'AT Medical' "$f" || echo "WARNING: $f does not reference AT Medical."
          done

  workflow-validation:
    name: Workflow File Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install YAML parser
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir 'PyYAML==6.0.2'
      - name: Validate workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' wf; do
            python3 -c "import sys,yaml; yaml.safe_load(open(sys.argv[1]))" "$wf" || failed=$((failed + 1))
          done < <(find .github/workflows -maxdepth 1 -name '*.yml' -print0)
          (( failed == 0 )) || exit 1
