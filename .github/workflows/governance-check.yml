name: Governance Check

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  governance-files:
    name: Governance File Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Verify governance documents
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for file in README.md SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md LICENSE CHANGELOG.md CODEOWNERS; do
            if [[ -s "$file" ]]; then
              echo "FOUND: $file"
            else
              echo "MISSING OR EMPTY: $file"
              missing=$((missing + 1))
            fi
          done
          (( missing == 0 )) || exit 1

  metadata-check:
    name: Metadata Presence Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install YAML parser
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir 'PyYAML==6.0.2'
      - name: Validate metadata profile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          import yaml
          with open('metadata/repository-profile.yml', encoding='utf-8') as handle:
              data = yaml.safe_load(handle)
          repository = data.get('repository', {})
          missing = [key for key in ('name', 'type', 'visibility', 'teams') if key not in repository]
          if missing:
              print(f'Missing required fields: {missing}')
              sys.exit(1)
          PY

  decisions-log:
    name: Decisions Log Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Verify decisions log
        run: test -s DECISIONS.md
