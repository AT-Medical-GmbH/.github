name: Documentation Consistency Check

on:
  push:
    branches: [main, develop, staging]
    paths: ["**.md", "**.yml", "CODEOWNERS"]
  pull_request:
    branches: [main, develop, staging]
    paths: ["**.md", "**.yml", "CODEOWNERS"]
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  doc-structure-check:
    name: Documentation Structure Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install YAML parser
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir 'PyYAML==6.0.2'
      - name: Check required documentation files
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for file in README.md SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md LICENSE CHANGELOG.md CODEOWNERS ARCHITECTURE.md DECISIONS.md metadata/repository-profile.yml configs/automation/copilot/repository-purpose.yml; do
            if [[ ! -f "$file" ]]; then echo "MISSING: $file"; missing=$((missing + 1)); fi
          done
          for template in .github/ISSUE_TEMPLATE/bug_report.yml .github/ISSUE_TEMPLATE/feature_request.yml .github/ISSUE_TEMPLATE/governance_feedback.yml; do
            if [[ ! -f "$template" ]]; then echo "MISSING: $template"; missing=$((missing + 1)); fi
          done
          (( missing == 0 )) || exit 1
      - name: Check version blocks
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for file in README.md SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md; do
            grep -q 'Version:' "$file" || { echo "VERSION BLOCK MISSING: $file"; missing=$((missing + 1)); }
          done
          (( missing == 0 )) || exit 1
      - name: Validate YAML files
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            python3 -c "import sys,yaml; yaml.safe_load(open(sys.argv[1]))" "$file" || failed=$((failed + 1))
          done < <(find .github/workflows metadata configs .github/ISSUE_TEMPLATE .github/DISCUSSION_TEMPLATE -name '*.yml' -print0 2>/dev/null)
          (( failed == 0 )) || exit 1
