name: Tag Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-tags:
    name: Validate File Tag Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install YAML parser
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir 'PyYAML==6.0.2'
      - name: Validate tag taxonomy and file-tags YAML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          import yaml

          def load(path):
              with open(path, encoding='utf-8') as handle:
                  return yaml.safe_load(handle)

          try:
              taxonomy = load('metadata/tags/taxonomy.yml')
              rules = load('metadata/tags/rules.yml')
              file_tags = load('metadata/tags/file-tags.yml')
          except (OSError, yaml.YAMLError) as exc:
              print(f'ERROR: {exc}')
              sys.exit(1)

          mandatory = rules.get('mandatory_tags', [])
          defaults = file_tags.get('defaults', {})
          missing = [name for name in mandatory if name not in defaults]
          if missing:
              print(f'WARNING: defaults missing mandatory dimensions: {missing}')

          valid_dimensions = set((taxonomy.get('dimensions') or {}).keys())
          errors = 0
          for entry_type in ('files', 'directories'):
              for path_key, tags in (file_tags.get(entry_type) or {}).items():
                  for dimension, value in tags.items():
                      if dimension not in valid_dimensions:
                          print(f'ERROR: unknown dimension {dimension!r} in {entry_type}/{path_key}')
                          errors += 1
                          continue
                      allowed = taxonomy['dimensions'][dimension].get('values', [])
                      if allowed and value not in allowed:
                          print(f'ERROR: invalid value {value!r} for {dimension!r} in {entry_type}/{path_key}')
                          errors += 1
          if errors:
              sys.exit(1)
          print('Tag validation passed.')
          PY
      - name: Validate repository profile fields
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          import yaml
          with open('metadata/repository-profile.yml', encoding='utf-8') as handle:
              data = yaml.safe_load(handle)
          repository = data.get('repository', {})
          missing = [key for key in ('name', 'type', 'visibility', 'teams') if key not in repository]
          if missing:
              print(f'ERROR: repository-profile.yml missing fields: {missing}')
              sys.exit(1)
          print('repository-profile.yml fields validated.')
          PY
