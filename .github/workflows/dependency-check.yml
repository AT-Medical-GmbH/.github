name: Dependency Check

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency License and Vulnerability Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4 major ref resolved 2026-07-10
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, LGPL-2.0, LGPL-2.1, AGPL-3.0

  action-versions:
    name: Check Action SHA Pinning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Reject mutable external Action references
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            while IFS= read -r line; do
              ref="${line##*@}"
              ref="${ref%%[[:space:]#]*}"
              if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]] && [[ "$line" != *"uses: ./"* ]]; then
                echo "ERROR: mutable action reference in $file: $line"
                failed=1
              fi
            done < <(grep -E '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]+[^[:space:]]+@' "$file" || true)
          done < <(find .github/workflows .github/actions -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 2>/dev/null)
          if (( failed != 0 )); then
            exit 1
          fi
          echo "All executable external Action references use full commit SHAs."
