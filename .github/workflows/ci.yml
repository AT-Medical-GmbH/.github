name: ATMED Required CI

on:
  push:
    branches:
      - main
      - develop
      - staging
      - pilot-rollout

  pull_request:
    branches:
      - main
      - develop
      - staging
      - pilot-rollout

  workflow_dispatch:

permissions:
  contents: read

jobs:
  central-ci:
    name: Central reusable CI
    permissions:
      contents: read
    uses: AT-Medical-GmbH/.github/.github/workflows/reusable-ci.yml@main
    with:
      run_lint: true
      run_tests: true
      node_version: "20"
