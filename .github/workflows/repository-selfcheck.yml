name: Repository Self-Check

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selfcheck:
    name: Repository Health Self-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir 'PyYAML==6.0.2'
      - name: Run repository self-check script
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/validate/repository-selfcheck.sh
          bash scripts/validate/repository-selfcheck.sh
