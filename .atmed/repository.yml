version: 1
repository:
  name: .github
  owner: AT-Medical-GmbH
  class: governance
  lifecycle: active
  service: github
  visibility: public
  data_class: public
  owner_team: devops-team
  technical_owner: governance-team
  dashboard: true
  deployable: false
  reports:
    private: true
    public: false
  central_tracking_issue: AT-Medical-GmbH/github-governance#26
  rollout_issue: AT-Medical-GmbH/.github#92

purpose:
  summary: Organization-wide GitHub profile, community files, templates, and shared repository conventions.
  belongs_here:
    - organization profile content
    - public-safe templates
    - public-safe repository guidance
    - shared issue and pull request conventions
  excluded:
    - service-specific application code
    - internal-only operational links
    - runtime data
    - customer data

governance:
  standard_source: AT-Medical-GmbH/github-governance
  rollout_mode: report-only
  dashboard_standard: standards/readme-dashboard-standard.md
  label_standard: standards/label-standard.yml
  branch_standard: standards/branch-standard.md
  ai_review_standard: standards/ai-review-standard.md
  report_standard: standards/report-standard.md
